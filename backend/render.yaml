services:
  - type: web
    name: drug-protocol-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_HOST
        value: your_db_host
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: your_database_name
      - key: DB_USER
        value: powerbi_reader
      - key: DB_PASSWORD
        value: ChangeMe123!
